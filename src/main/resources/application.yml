spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sst}
    username: ${DB_USER:sst}
    password: ${DB_PASS:sst}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
