services:
  - type: web
    name: sst-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: master
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
