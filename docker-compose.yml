services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sst
      POSTGRES_USER: sst
      POSTGRES_PASSWORD: sst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/sst
      DB_USER: sst
      DB_PASS: sst
    depends_on:
      - db

volumes:
  postgres_data:
